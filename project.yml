name: Dial
options:
  bundleIdPrefix: com.santiagoalonso
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: QAMM2A6WRQ
    GENERATE_INFOPLIST_FILE: YES
targets:
  Dial:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Dial]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.santiagoalonso.dial
        # iPhone only. Without this, adding macOS as a destination made XcodeGen emit "1,2" (iPhone + iPad).
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: Dial
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "35"
        INFOPLIST_KEY_CFBundleDisplayName: Dial
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Dial/Dial-macOS.entitlements
        # iCloud key-value storage syncs favorites. CarPlay audio needs Apple's approval for device builds,
        # so only the simulator's CarPlay window gets it until Apple grants the entitlement.
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Dial/Dial-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Dial/Dial-iOS-Simulator.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES[sdk=iphone*]: [AppIconMonogram, AppIconSignal, AppIconPocket]
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS[sdk=iphone*]: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
    info:
      path: Dial/Info.plist
      properties:
        CFBundleDisplayName: Dial
        UILaunchScreen: {}
        LSApplicationCategoryType: public.app-category.music
        ITSAppUsesNonExemptEncryption: false
        # macOS: menu bar app with no Dock icon. iOS ignores this key.
        LSUIElement: true
        UIBackgroundModes: [audio]
        # SwiftUI provides the phone window; CarPlay gets its own template scene.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        CFBundleURLTypes:
          - CFBundleURLName: com.santiagoalonso.dial
            CFBundleURLSchemes: [dialradio]
        NSLocationWhenInUseUsageDescription: Choose your country from your approximate location when you tap Use my location.
        NSLocationDefaultAccuracyReduced: true
        NSLocationUsageDescription: Choose your country from your approximate location when you click Use my location.
        NSAlarmKitUsageDescription: Ring the station alarms you create in Dial.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  DialTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [DialTests]
    settings:
      base:
        TEST_HOST[sdk=macosx*]: $(BUILT_PRODUCTS_DIR)/Dial.app/Contents/MacOS/Dial
    dependencies:
      - target: Dial
  DialUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DialUITests]
    dependencies:
      - target: Dial
schemes:
  Dial:
    build:
      targets:
        Dial: all
    test:
      targets: [DialTests, DialUITests]
